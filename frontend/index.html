<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Personal Search Assistant</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="header-brand">
        <h1>AI Personal Search Assistant</h1>
        <div id="currentDate" class="header-date" aria-label="Current date" title="Current Date">
          <span class="date-icon" aria-hidden="true">📅</span>
          <span id="currentDateText"></span>
        </div>
      </div>
      <div class="header-right">
        <div class="user-selector-row">
          <label for="userIdInput" class="user-label">
            <span class="user-icon" aria-hidden="true">👤</span> User:
          </label>
          <input type="text" id="userIdInput" value="noam" class="user-input">
        </div>
        <div class="header-actions">
          <a id="githubRepoLink" href="https://github.com/noam2030/personal_search_assistant" target="_blank" rel="noopener noreferrer" class="btn-github" title="View GitHub Repository" aria-label="GitHub Repository">
            <svg class="github-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
            <span>GitHub</span>
          </a>
          <button id="openCreateTaskModalBtn" class="btn-primary-action">New Task</button>
          <button id="refreshTasksBtn" class="btn-secondary">Refresh</button>
          <button id="runAllTasksBtn" class="btn-secondary">Run All</button>
        </div>
      </div>
    </header>

    <!-- Task List View (Full Width) -->
    <div class="card full-width-card">
      <div class="tasks-header-row">
        <h2 class="card-title" style="margin-bottom: 0;">Your Tasks</h2>
      </div>
      <div id="taskList" class="task-list">
        <p style="color: var(--text-muted);">Loading tasks...</p>
      </div>
    </div>

    <!-- App Footer with Repository Link -->
    <footer class="app-footer">
      <p>
        AI Personal Search Assistant &bull;
        <a href="https://github.com/noam2030/personal_search_assistant" target="_blank" rel="noopener noreferrer">
          <svg class="github-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="vertical-align: -2px; margin-right: 2px;">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub Repository
        </a>
      </p>
    </footer>
  </div>

  <!-- Create / Edit Task Modal Overlay -->
  <div id="taskModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Create New Task</h2>
        <button id="closeTaskModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <form id="createTaskForm">
        <div class="form-group">
          <label for="taskDescription">What would you like me to do or monitor?</label>
          <textarea id="taskDescription" rows="4" placeholder="e.g. Find me jobs in Tel Aviv. Java. Back end.&#10;e.g. Tell me when there is a price drop or room available on https://example.com" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" id="submitTaskBtn"><span id="submitTaskBtnText">Create Task</span></button>
          <button type="button" id="cancelTaskModalBtn" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
