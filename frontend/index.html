<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Personal Search Assistant</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>AI Personal Search Assistant</h1>
      <div class="header-actions">
        <button id="openCreateTaskModalBtn" class="btn-primary-action">New Task</button>
        <div class="user-selector">
          <label for="userIdInput" style="font-size: 0.85rem; color: var(--text-muted);">User:</label>
          <input type="text" id="userIdInput" value="noam" style="width: 100px;">
          <button id="refreshTasksBtn" class="btn-secondary">Refresh</button>
          <button id="runAllTasksBtn" class="btn-secondary">Run All</button>
        </div>
      </div>
    </header>

    <!-- Task List View (Full Width) -->
    <div class="card full-width-card">
      <div class="tasks-header-row">
        <h2 class="card-title" style="margin-bottom: 0;">Your Tasks</h2>
      </div>
      <div id="taskList" class="task-list">
        <p style="color: var(--text-muted);">Loading tasks...</p>
      </div>
    </div>
  </div>

  <!-- Create / Edit Task Modal Overlay -->
  <div id="taskModal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-title">Create New Task</h2>
        <button id="closeTaskModalBtn" class="modal-close-btn">&times;</button>
      </div>
      <form id="createTaskForm">
        <div class="form-group">
          <label for="taskDescription">What would you like me to do or monitor?</label>
          <textarea id="taskDescription" rows="4" placeholder="e.g. Find me jobs in Tel Aviv. Java. Back end.&#10;e.g. Tell me when there is a price drop or room available on https://example.com" required></textarea>
        </div>
        <div class="modal-actions">
          <button type="submit" id="submitTaskBtn"><span id="submitTaskBtnText">Create Task</span></button>
          <button type="button" id="cancelTaskModalBtn" class="btn-secondary">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
